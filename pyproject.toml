[build-system]
requires = ['hatchling >= 1.27']
build-backend = 'hatchling.build'

[project]
name = 'unitx'
version = '0.17.7'
description = 'Physical units, quantities, and unit conversion with exact unit algebra, type hints, and NumPy integration.'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = 'Dait' }]
dependencies = []
keywords = [
  'unit',
  'units',
  'quantity',
  'physical quantities',
  'unit conversion',
  'dimensional analysis',
  'unit algebra',
  'SI units',
  'physical constants',
  'exact arithmetic',
  'numpy',
  'scientific computing',
  'physics',
  'engineering',
  'temperature conversion',
  'logarithmic units',
]
classifiers = [
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Programming Language :: Python :: 3.15',
  'Topic :: Scientific/Engineering :: Physics',
]

[project.optional-dependencies]
test = ['pytest>=8', 'ruff>=0.8', 'pyright>=1.1.414']
numpy = ['numpy>=2.1']
scipy = ['numpy>=2.1', 'scipy>=1.14']
matplotlib = ['numpy>=2.1', 'matplotlib>=3.9']

[project.urls]
Homepage = 'https://github.com/DaitTHU/unitx'
Documentation = 'https://daitthu.github.io/unitx/'
Source = 'https://github.com/DaitTHU/unitx'
Changelog = 'https://github.com/DaitTHU/unitx/blob/main/CHANGELOG.md'
Issues = 'https://github.com/DaitTHU/unitx/issues'

[tool.hatch.build.targets.wheel]
packages = ['src/unitx']

[tool.pytest.ini_options]
testpaths = ['tests', 'src/unitx']
pythonpath = ['src']
addopts = '--doctest-modules'

[tool.ruff]
target-version = 'py312'
line-length = 100

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I']
