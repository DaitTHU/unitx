name: Release

# Configure a PyPI Trusted Publisher for DaitTHU/unitx, release.yml, and the
# GitHub environment named pypi.
# Manual runs validate distributions; publishing a GitHub release uploads them.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} does not match project version {version!r}.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          print(f'Building unitx {version}')
          PY

      - name: Install build and validation dependencies
        run: python -m pip install -e ".[test]" build twine

      - name: Validate source
        run: |
          python -m ruff check .
          python -m ruff check tests conftest.py --select ANN --ignore ANN401
          python -m ruff format --check .
          python -m pytest -q
          python -m doctest README.md docs/*.md docs/catalogues/*.md

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install built wheel and copy consumers outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/unitx-consumers"
          cp .github/consumers/*.py .github/consumers/pyrightconfig.json "$RUNNER_TEMP/unitx-consumers/"

      - name: Check installed scalar runtime and types without NumPy
        working-directory: ${{ runner.temp }}/unitx-consumers
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -I scalars.py
          python -m pyright --project pyrightconfig.json --pythonpath "$(command -v python)" scalars.py

      - name: Install optional NumPy
        run: python -m pip install 'numpy>=2.1'

      - name: Check installed NumPy runtime and types
        working-directory: ${{ runner.temp }}/unitx-consumers
        run: |
          python -I arrays.py
          python -m pyright --project pyrightconfig.json --pythonpath "$(command -v python)" arrays.py

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unitx
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
