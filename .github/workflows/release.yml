name: Release

# Configure a PyPI Trusted Publisher for DaitTHU/unitx, release.yml, and the
# GitHub environment named pypi.
# Manual runs validate distributions; publishing a GitHub release uploads them.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} does not match project version {version!r}.')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          print(f'Building unitx {version}')
          PY

      - name: Install build and validation dependencies
        run: python -m pip install -e ".[test]" build twine

      - name: Validate source
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
          python -m doctest README.md docs/*.md docs/catalogues/*.md

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Check installed package
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from fractions import Fraction
          from importlib.metadata import version
          from importlib.resources import files

          from unitx.quantity import Quantity
          from unitx.unit import Unit

          assert version('unitx') == os.environ['EXPECTED_VERSION']
          assert files('unitx').joinpath('py.typed').is_file()
          assert Quantity(1, 'cm').to('m').value == Fraction(1, 100)
          assert 2 * Unit('m') == Quantity(200, 'cm')
          PY

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unitx
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
