name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.backend }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        backend: ["builtin", "sympy"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install SymPy
        if: matrix.backend == 'sympy'
        run: python -m pip install sympy

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: |
          pytest -q
          python -m doctest README.md docs/units.md docs/scalars.md docs/affine.md

  numpy:
    name: NumPy ${{ matrix.numpy }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            numpy: '2.1.*'
          - python-version: '3.14'
            numpy: 'latest'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: python -m pip install -e '.[test,numpy]' 'matplotlib>=3.9'
      - name: Select minimum NumPy
        if: matrix.numpy != 'latest'
        run: python -m pip install 'numpy==${{ matrix.numpy }}'
      - name: Run tests and typing
        run: |
          pytest -q
          python -m doctest README.md docs/units.md docs/scalars.md docs/affine.md
