name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation with strict link checks
        run: python -m mkdocs build --strict

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.backend }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        backend: ["builtin", "sympy"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install SymPy
        if: matrix.backend == 'sympy'
        run: python -m pip install sympy

      - name: Run Ruff
        run: |
          ruff check .
          ruff check tests conftest.py --select ANN --ignore ANN401
          ruff format --check .

      - name: Run tests
        run: |
          pytest -q
          python -m doctest README.md docs/*.md docs/catalogues/*.md docs/numpy/*.md

  numpy:
    name: NumPy ${{ matrix.numpy }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            numpy: '2.1.*'
          - python-version: '3.14'
            numpy: 'latest'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: python -m pip install -e '.[test,numpy]' 'matplotlib>=3.9'
      - name: Select minimum NumPy and Matplotlib
        if: matrix.numpy != 'latest'
        run: python -m pip install 'numpy==${{ matrix.numpy }}' 'matplotlib==3.9.*'
      - name: Run tests and typing
        run: |
          pytest -q
          python -m doctest README.md docs/*.md docs/catalogues/*.md docs/numpy/*.md

  installed:
    name: Installed wheel (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build and type-check dependencies
        run: python -m pip install build twine 'pyright>=1.1.414'

      - name: Build and check distributions
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
          python -m build
          python -m twine check --strict dist/*

      - name: Install built wheel and copy consumers outside the checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/unitx-consumers"
          cp .github/consumers/*.py .github/consumers/pyrightconfig.json "$RUNNER_TEMP/unitx-consumers/"

      - name: Check installed scalar runtime and types without NumPy
        working-directory: ${{ runner.temp }}/unitx-consumers
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -I scalars.py
          python -m pyright --project pyrightconfig.json --pythonpath "$(command -v python)" scalars.py

      - name: Install optional NumPy
        run: python -m pip install 'numpy>=2.1'

      - name: Check installed NumPy runtime and types
        working-directory: ${{ runner.temp }}/unitx-consumers
        run: |
          python -I arrays.py
          python -m pyright --project pyrightconfig.json --pythonpath "$(command -v python)" arrays.py

      - name: Install optional Matplotlib
        run: python -m pip install 'matplotlib>=3.9'

      - name: Check installed Matplotlib runtime and types
        working-directory: ${{ runner.temp }}/unitx-consumers
        run: |
          python -I plots.py
          python -m pyright --project pyrightconfig.json --pythonpath "$(command -v python)" plots.py
